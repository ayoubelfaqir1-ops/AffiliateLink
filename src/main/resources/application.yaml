spring:
  application:
    name: affiliateLink
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  output:
    ansi:
      console-available: ALWAYS
server:
  port: 8081

logging:
  file:
    name: logs/affiliatelink.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%-5level) %clr(%pid){magenta} %clr(---){faint} %clr(%logger{36}){cyan} %clr(:){faint} %msg%n"
  level:
    ma.youcode.affiliatelink: INFO
